{% extends 'base.html' %}
{% block title %}Reset password | LOL{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-aside">
        <p class="eyebrow">NO WORRIES</p>
        <h1>We all forget<br><em>sometimes.</em></h1>
        <p>We'll send a private reset link to the email on your account.</p>
    </div>
    <div class="auth-panel">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h2>Reset password</h2>
        <form method="post" class="form-stack"><input type="hidden" name="csrf_token"
                value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="email"
                    required></label><button class="button button-primary" type="submit">Send reset link <span
                    aria-hidden="true">↗</span></button></form>
        <p class="auth-bottom"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
    </div>
</section>
{% endblock %}
