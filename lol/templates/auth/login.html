{% extends 'base.html' %}
{% block title %}Log in | LOL{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-aside">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Your people<br>are <em>right here.</em></h1>
        <p>Pick up exactly where the conversation left off.</p>
    </div>
    <div class="auth-panel">
        <p class="eyebrow">ACCOUNT ACCESS</p>
        <h2>Log in</h2>
        <form method="post" class="form-stack"><input type="hidden" name="csrf_token"
                value="{{ csrf_token() }}"><label>Email, phone, or username<input name="identifier"
                    autocomplete="username" required autofocus></label><label>Password<input type="password"
                    name="password" autocomplete="current-password" required></label><label class="check-row"><input
                    type="checkbox" name="remember"> Keep me signed in</label><button class="button button-primary"
                type="submit">Log in <span aria-hidden="true">↗</span></button></form>
        <div class="auth-links"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a><span>New here? <a
                    href="{{ url_for('auth.register') }}">Create an account</a></span></div>
    </div>
</section>
{% endblock %}
