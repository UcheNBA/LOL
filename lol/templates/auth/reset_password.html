{% extends 'base.html' %}
{% block title %}Choose a new password | LOL{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-aside">
        <p class="eyebrow">ONE LAST THING</p>
        <h1>Back to<br><em>good chats.</em></h1>
        <p>Choose a new password for your account.</p>
    </div>
    <div class="auth-panel">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h2>New password</h2>
        <form method="post" class="form-stack"><input type="hidden" name="csrf_token"
                value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="10"
                    autocomplete="new-password" required autofocus><small>At least 10 characters</small></label><button
                class="button button-primary" type="submit">Update password <span aria-hidden="true">↗</span></button>
        </form>
    </div>
</section>
{% endblock %}
